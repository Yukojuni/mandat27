<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mandat 27</title>
<meta name="description" content="Deviens président ou présidente de 2027 à 2032 : 30 décisions réelles, sourcées. À la fin, découvre quels candidats ont fait les mêmes choix.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#13234B;--blue:#2A5BFF;--blue2:#1E46D6;--red:#FF4B55;--yel:#FFC800;--yel2:#E0A800;--grn:#3DDC84;--grn2:#22B86A;--vio:#8B5CF6;--sky1:#43C6FF;--sky2:#1E8BFF;--bg:#F3F6FF;--line:#DDE4F7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Nunito,system-ui,sans-serif;font-weight:700}
#app{overflow-x:clip;max-width:480px;margin:0 auto;min-height:100vh;padding:16px 18px 48px}
h1,h2,h3{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;letter-spacing:.3px;margin:.2em 0 .4em;line-height:1.1}
h1{font-size:54px}h1 span{color:var(--yel)}h2{font-size:30px}h3{font-size:22px}
p{line-height:1.45;margin:.4em 0}
a{color:var(--blue)}
.lead{font-size:18px}.small{font-size:15px;opacity:.85}.fine{font-size:12.5px;opacity:.65;text-align:center;margin-top:18px}
.hint{font-size:14px;opacity:.75}
.btn{font:inherit;font-family:"Lilita One",Nunito,system-ui,sans-serif;font-size:19px;letter-spacing:.4px;border:0;border-radius:18px;padding:14px 22px;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue2);cursor:pointer;transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue2)}
.btn.big{font-size:22px;padding:17px}
.btn.gold{background:var(--yel);color:var(--navy);box-shadow:0 5px 0 var(--yel2);margin-top:18px}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.sm{font-size:14px;padding:8px 14px;width:auto;border-radius:12px;box-shadow:0 3px 0 var(--line)}
.link{background:none;border:0;font:inherit;color:var(--blue);text-decoration:underline;cursor:pointer;padding:10px;font-size:15px}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.nav{display:flex;gap:12px;margin-top:22px}.nav.col{flex-direction:column}
.tag{display:inline-block;background:var(--navy);color:#fff;font-size:13px;font-weight:900;padding:5px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:.6px}
.card{background:#fff;border-radius:20px;padding:16px 18px;margin:12px 0;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.card b{font-weight:900}
.src{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:800;color:var(--blue);text-decoration:none;background:#EEF2FF;padding:4px 9px;border-radius:999px}
.src.off{color:#6B7699;background:#F0F2F8}
/* animations */
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}.d5{animation-delay:.4s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
/* home */
.home{text-align:center;position:relative;padding-top:18px}
.sky{position:absolute;inset:-16px -18px auto;height:260px;background:linear-gradient(var(--sky1),var(--sky2));border-radius:0 0 40px 40px;z-index:-1;overflow:hidden}
.sun{position:absolute;right:30px;top:24px;width:56px;height:56px;border-radius:50%;background:var(--yel)}
.cloud{position:absolute;background:#fff;border-radius:999px;height:22px;opacity:.9;animation:drift 14s linear infinite}
.cloud.c1{width:90px;top:40px;left:-100px}.cloud.c2{width:60px;top:100px;left:-80px;animation-delay:-6s}
@keyframes drift{to{transform:translateX(620px)}}
.hero .logo{width:118px;height:118px;filter:drop-shadow(0 8px 0 rgba(19,35,75,.25));margin-top:30px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.home h1{margin-top:28px}
/* top bar */
.top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;background:var(--grn);border-radius:999px;transition:width .5s}
.cnt{font-weight:900;font-size:14px}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.g{background:#fff;border-radius:14px;padding:7px 9px;border:2px solid var(--line)}
.gl{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
.gb{height:8px;background:var(--bg);border-radius:9px;margin:4px 0;overflow:hidden}.gb i{display:block;height:100%;border-radius:9px;transition:width .6s}
.gv{font-family:"Lilita One",Nunito,system-ui,sans-serif;font-size:15px}
/* map */
.year{margin:20px 0 8px}
.yh{display:flex;gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:20px;padding:12px 14px}
.yh b{font-family:"Lilita One",Nunito,system-ui,sans-serif;font-size:22px;background:var(--yel);color:var(--navy);padding:6px 10px;border-radius:12px}
.yh h3{margin:0;font-size:19px}.yh p{margin:0;font-size:13px;opacity:.8}
.y1 .yh b{background:var(--grn)}.y2 .yh b{background:var(--sky1)}.y3 .yh b{background:var(--red);color:#fff}.y4 .yh b{background:var(--vio);color:#fff}
.path{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0}
.node{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;transform:translateX(var(--x));font:inherit;color:var(--navy)}
.node .dot{width:66px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:"Lilita One",Nunito,system-ui,sans-serif;font-size:24px;background:#C9D2EA;color:#fff;box-shadow:0 6px 0 #AEB9D8}
.node.done .dot{background:var(--yel);box-shadow:0 6px 0 var(--yel2);color:var(--navy)}
.node.next .dot{background:var(--blue);box-shadow:0 6px 0 var(--blue2);animation:pulse 1.4s ease-in-out infinite}
.node.open .dot{background:var(--blue);box-shadow:0 6px 0 var(--blue2)}
.node.lock{opacity:.55;cursor:default}
.node .nt{font-size:12px;font-weight:900;margin-top:8px;background:#fff;padding:3px 9px;border-radius:999px;border:2px solid var(--line)}
@keyframes pulse{50%{transform:scale(1.08)}}
/* question */
.steps{display:flex;gap:6px;margin:12px 0 4px}.steps i{flex:1;height:7px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--grn)}.steps i.cur{background:var(--blue)}
.slabel{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;opacity:.6}
.qbody{min-height:300px;margin-top:10px}
.hook{font-size:20px;line-height:1.4}
.bubble{background:var(--blue);color:#fff;border-radius:24px 24px 24px 6px;padding:20px;font-size:19px;margin-top:20px;box-shadow:0 6px 0 var(--blue2)}
.bubble b{font-family:"Lilita One",Nunito,system-ui,sans-serif;font-weight:400;font-size:16px;color:var(--yel);display:block;margin-bottom:6px}
.fact p{font-size:16.5px}
.side .lbl,.event .lbl{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;padding:3px 9px;border-radius:999px;color:#fff}
.side.pro .lbl{background:var(--grn2)}.side.con .lbl{background:var(--red)}
.side small{opacity:.65;font-size:13px}
.world b{font-family:"Lilita One",Nunito,system-ui,sans-serif;font-weight:400;font-size:18px;color:var(--blue)}
.opt{background:#fff;border:3px solid var(--line);border-radius:20px;margin:12px 0;box-shadow:0 5px 0 var(--line);cursor:pointer;overflow:hidden;transition:border-color .2s}
.opt .oh{display:flex;gap:12px;align-items:center;padding:14px}
.ol{flex:none;width:36px;height:36px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-family:"Lilita One",Nunito,system-ui,sans-serif;font-size:20px}
.opt .od{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 14px}
.opt.open{border-color:var(--blue)}.opt.open .ol{background:var(--blue);color:#fff}.opt.open .od{max-height:520px;padding-bottom:14px}
.od p{font-size:15px}.pl{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.pl.g{color:var(--grn2)}.pl.r{color:var(--red)}.pl.b{color:var(--blue)}
.od .btn{margin-top:8px}
.imp{display:flex;gap:10px;align-items:center;font-size:14px;margin:14px 4px}.imp{cursor:pointer;min-height:44px}.imp input{width:28px;height:28px;flex:none;accent-color:var(--blue)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kpi{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.kpi small{display:block;font-size:11px;font-weight:900;text-transform:uppercase;opacity:.6;margin-bottom:6px}
.kpi .big{font-family:"Lilita One",Nunito,system-ui,sans-serif;font-size:26px;font-weight:400}
.up{color:var(--grn2);font-weight:900}.down{color:var(--red);font-weight:900}.eq{opacity:.6;font-weight:900}
.lesson{background:var(--yel);border-color:var(--yel2);box-shadow:0 5px 0 var(--yel2)}
/* urne */
.elect{text-align:center;padding-top:30px}
.stage{position:relative;height:250px;margin:10px auto 10px;width:220px}
.urne{width:200px;position:absolute;bottom:0;left:10px}
.b-drop{position:absolute;left:84px;top:0;width:52px;animation:drop 1s .2s cubic-bezier(.5,0,.8,.4) both}
.b-drop svg{width:52px}
@keyframes drop{0%{transform:translateY(-30px) rotate(-12deg);opacity:0}30%{opacity:1}100%{transform:translateY(118px) rotate(0);opacity:0}}
.stamp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-10deg) scale(0);font-family:"Lilita One",Nunito,system-ui,sans-serif;font-size:44px;color:var(--red);border:5px solid var(--red);border-radius:12px;padding:2px 14px;background:#fff;animation:stamp .4s 1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{to{transform:translate(-50%,-50%) rotate(-10deg) scale(1)}}
/* bilan */
.bilan{position:relative;overflow:hidden}
.confetti i{position:absolute;top:-20px;left:calc(var(--i)*5.6%);width:9px;height:14px;border-radius:3px;background:var(--yel);animation:fall 2.4s calc(var(--i)*.07s) ease-in forwards;opacity:0}
.confetti i:nth-child(3n){background:var(--blue)}.confetti i:nth-child(3n+1){background:var(--red)}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(560px) rotate(540deg)}}
.event{border-color:var(--vio);box-shadow:0 5px 0 #6D3FE0}.event .lbl{background:var(--vio)}
/* verdict */
.panneau{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0;background:#A8B3CF;padding:12px;border-radius:18px}
.affiche{perspective:800px;min-height:230px}
.affiche .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flip .7s var(--d) both}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.front,.back{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:#fff;display:grid;place-items:center;font-family:"Lilita One",Nunito,system-ui,sans-serif;font-size:44px;color:var(--line)}
.back{transform:rotateY(180deg);background:#fff;padding:12px;display:flex;flex-direction:column;gap:3px}
.affiche:first-child .back{background:var(--yel)}
.rk{font-family:"Lilita One",Nunito,system-ui,sans-serif;font-size:22px;color:var(--blue)}
.nm{font-family:"Lilita One",Nunito,system-ui,sans-serif;font-size:clamp(14px,4.4vw,18px);line-height:1.1;overflow-wrap:anywhere}
.pt{font-size:12px;opacity:.7;line-height:1.2}
.meter{height:10px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:auto}.meter i{display:block;height:100%;background:var(--blue)}
.pc{font-family:"Lilita One",Nunito,system-ui,sans-serif;font-size:26px}
.back small{font-size:11.5px;opacity:.75}.back .link{font-size:12.5px;padding:12px 0 6px;text-align:left}
.warn{border-color:var(--red);box-shadow:0 5px 0 #E03540}
.detail table{width:100%;border-collapse:collapse;font-size:13px}
.detail td,.detail th{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.detail tr.same td{background:#EAFBF2}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;max-width:90%;white-space:pre-line;font-size:14px;z-index:9;animation:pop .3s both}

/* ───── V2 : personnages */
.perso{display:block;width:100%;height:auto;overflow:visible}
#rvpark{position:fixed;left:0;bottom:0;width:24px;height:24px;overflow:hidden;opacity:.01;pointer-events:none;z-index:-1}#rvpark canvas{width:24px;height:30px;display:block}
.rv{display:block;position:relative;aspect-ratio:100/124}
.rv>.pfb{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:opacity .25s}
.rv>.rvc{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;pointer-events:none}
.rv.rv-on>.rvc{opacity:1}.rv.rv-on>.pfb{opacity:0}
.rvstage .rvbox{position:absolute;inset:0;aspect-ratio:auto}
.rvstage .rvbox>.pfb{overflow:visible}
.perso .bob{animation:pbob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.perso .eyes{animation:blink 4.6s infinite;transform-origin:50% 46px}
@keyframes pbob{50%{transform:translateY(-2px) scaleY(1.015)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.speaking .perso .mo{animation:talk .18s ease-in-out infinite alternate;transform-origin:50px 62px}
@keyframes talk{to{transform:scaleY(.35)}}
.say{display:flex;gap:10px;align-items:flex-end;margin:14px 0;cursor:pointer}
.say.right{flex-direction:row-reverse}
.say.wait{opacity:0;transform:translateY(8px)}
.say{transition:opacity .25s,transform .25s}
.av{flex:none;width:68px;text-align:center}
.av .perso{width:68px}
.who{display:block;font-size:12px;font-weight:900;line-height:1.1;margin-top:2px}
.who small{display:block;font-weight:700;opacity:.6;font-size:10px}
.bub{position:relative;flex:1;background:#fff;border:2px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 14px;box-shadow:0 4px 0 var(--line);font-size:15.5px}
.say.right .bub{border-radius:20px 20px 6px 20px}
.bub p{margin:0;min-height:1.4em}
.bub.red{background:#FFF0F1;border-color:#FFC7CB;box-shadow:0 4px 0 #FFC7CB}
.bub.green{background:#EAFBF2;border-color:#B8EFD2;box-shadow:0 4px 0 #B8EFD2}
.bub .att{display:block;margin-top:6px;opacity:.65;font-size:12px}
.bub .dt p{font-size:14px;margin-top:6px}
/* home cast */
.cast{display:flex;justify-content:center;gap:2px;margin:14px -8px 0}
.cm{width:19%;animation:hop 2.4s calc(var(--i)*.25s) ease-in-out infinite}
.cm b{display:block;font-size:12px}.cm small{display:block;font-size:9.5px;opacity:.6;line-height:1.1}
@keyframes hop{0%,70%,100%{transform:none}80%{transform:translateY(-10px)}}
/* élection */
.crowd{display:flex;justify-content:center;gap:0;margin-top:150px;position:relative;z-index:1}
.fan{width:17%;margin:0 -1%;animation:cheer .6s calc(var(--i)*.1s) ease-in-out infinite alternate}
@keyframes cheer{to{transform:translateY(-12px)}}
.tv{position:absolute;left:50%;top:20px;transform:translateX(-50%);width:250px;height:150px;background:var(--navy);border-radius:22px;padding:10px;box-shadow:0 8px 0 #0B1736}
.tvin{position:relative;height:100%;border-radius:14px;background:linear-gradient(var(--sky1),var(--sky2));overflow:hidden;display:grid;place-items:center}
.bandeau{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-family:"Lilita One",Nunito,sans-serif;font-size:12px;padding:3px 8px;border-radius:6px;letter-spacing:.5px;animation:blinkb 1s steps(2) infinite}
@keyframes blinkb{50%{opacity:.6}}
.count span{font-family:"Lilita One",Nunito,sans-serif;font-size:46px;color:#fff;animation:out .3s 1.3s forwards}
.reveal{position:absolute;font-family:"Lilita One",Nunito,sans-serif;font-size:36px;color:var(--yel);transform:scale(0);animation:boom .5s 1.6s cubic-bezier(.2,1.8,.4,1) forwards;text-shadow:0 4px 0 var(--navy)}
@keyframes out{to{opacity:0;transform:scale(.4)}}@keyframes boom{to{transform:scale(1) rotate(-6deg)}}
.elect{position:relative}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti.fixed{position:fixed}
.confetti i{position:absolute;top:-20px;left:calc(var(--i)*4.2%);width:9px;height:14px;border-radius:3px;background:var(--yel);animation:fall 2.4s calc(var(--i)*.06s) ease-in forwards;opacity:0}
.confetti i:nth-child(3n){background:var(--blue)}.confetti i:nth-child(3n+1){background:var(--red)}.confetti i:nth-child(4n){background:var(--grn)}
/* JT */
.tvbig{position:relative;background:var(--navy);border-radius:24px;padding:10px;box-shadow:0 6px 0 #0B1736;margin-top:10px}
.tvbig .studio{height:170px;border-radius:16px;background:linear-gradient(#5AA2FF,#2A5BFF);display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
.tvbig .studio .perso{width:140px;margin-bottom:-6px}
.tvbig.small .studio{height:130px}.tvbig.small .studio .perso{width:110px}
.tvbig .bandeau{top:18px;left:18px}
.lower{position:absolute;left:18px;right:18px;bottom:44px;background:#fff;border-left:8px solid var(--red);border-radius:6px;padding:6px 10px;font-size:15px;animation:slidein .5s .3s both}
.tvbig.small .lower{bottom:18px}
@keyframes slidein{from{transform:translateX(-110%)}}
.ticker{margin-top:8px;background:var(--yel);border-radius:8px;overflow:hidden;white-space:nowrap;font-weight:900;font-size:13px;padding:5px 0}
.ticker span{display:inline-block;padding-left:100%;animation:tick 18s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
/* SMS */
.phone{background:var(--navy);border-radius:34px;padding:10px;box-shadow:0 6px 0 #0B1736;margin-top:10px}
.ph-top{display:flex;gap:10px;align-items:center;background:#fff;border-radius:24px 24px 8px 8px;padding:8px 12px}
.ph-top .perso{width:42px}.ph-top b{display:block}.ph-top small{color:var(--grn2);font-weight:900}
.ph-body{background:#EEF2FF;border-radius:8px 8px 24px 24px;padding:14px 12px;min-height:300px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:84%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.4}
.msg.in{background:#fff;border-bottom-left-radius:5px;align-self:flex-start}
.msg.out{background:var(--blue);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.typing{align-self:flex-start;background:#fff;border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#AEB9D8;animation:dots 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{transform:translateY(-5px)}}
/* dossier */
.desk{position:relative;background:#8B5E3C;border-radius:22px;padding:18px 14px 14px;display:flex;gap:10px;align-items:flex-end;box-shadow:0 6px 0 #6E4A2F;margin-top:10px}
.desk>.perso{width:110px;flex:none}
.folder{position:relative;flex:1;background:#FFE08A;border-radius:6px 14px 14px 14px;padding:22px 14px 14px;transform:rotate(-3deg);animation:slap .5s .2s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 5px 0 #E0B94F}
.folder h2{font-size:21px;margin:0}
.folder .tab{position:absolute;top:-14px;left:0;background:#FFE08A;border-radius:8px 8px 0 0;padding:2px 10px;font-size:11px;font-weight:900}
.stampu{position:absolute;right:8px;top:6px;color:var(--red);border:3px solid var(--red);border-radius:6px;font-family:"Lilita One",Nunito,sans-serif;font-size:14px;padding:0 6px;transform:rotate(10deg) scale(0);animation:stamp2 .3s .8s forwards}
@keyframes slap{from{transform:translateY(-40px) rotate(-12deg);opacity:0}}
@keyframes stamp2{to{transform:rotate(10deg) scale(1)}}
.postit{background:#FFF59A;padding:12px 14px;border-radius:4px;transform:rotate(1.5deg);box-shadow:0 5px 0 #E8DC6A;margin:14px 6px}
.postit b{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;color:#C0392B}
/* quiz */
.quiz{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.qa{font:inherit;font-family:"Lilita One",Nunito,sans-serif;font-size:20px;padding:15px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--navy);box-shadow:0 5px 0 var(--line);cursor:pointer}
.qa.ok{background:var(--grn);border-color:var(--grn2);box-shadow:0 5px 0 var(--grn2);color:#fff;animation:pop .4s}
.qa.ko{background:var(--red);border-color:#E03540;box-shadow:0 5px 0 #E03540;color:#fff}
.qa.dim{opacity:.45}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* flips */
.flips{display:flex;flex-direction:column;gap:12px}
.flip{perspective:900px;min-height:150px;cursor:pointer}
.fi{position:relative;min-height:150px;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:14px 16px}
.ff{background:var(--blue);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 5px 0 var(--blue2)}
.ff span{font-weight:900;text-transform:uppercase;font-size:12px;opacity:.8}.ff b{font-family:"Lilita One",Nunito,sans-serif;font-size:54px;font-weight:400}
.fb{background:#fff;border:2px solid var(--line);transform:rotateY(180deg);overflow:auto}
/* débat */
.vs{display:flex;align-items:flex-end;justify-content:space-between;background:linear-gradient(90deg,#3DDC84 50%,#FF4B55 50%);border-radius:24px;padding:14px 18px 0;overflow:hidden;position:relative;height:170px}
.vs .side{width:40%;position:relative;text-align:center}
.vs .side .perso{width:120px;margin:0 auto -4px}
.vs .side.l{animation:inl .5s both}.vs .side.r{animation:inr .5s both}
@keyframes inl{from{transform:translateX(-120%)}}@keyframes inr{from{transform:translateX(120%)}}
.vs .pl{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#fff;padding:2px 10px;border-radius:999px;font-size:12px}
.bolt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg) scale(0);font-family:"Lilita One",Nunito,sans-serif;font-size:44px;color:var(--yel);background:var(--navy);border-radius:18px;padding:2px 14px;animation:vsb .5s .5s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes vsb{to{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
/* ailleurs */
.yukihead{position:relative;display:flex;justify-content:center;align-items:flex-end;background:linear-gradient(#BDEBFF,#E9F8FF);border-radius:24px;height:160px;overflow:hidden}
.yukihead .perso{width:120px;margin-bottom:-6px;position:relative;z-index:1}
.yukihead .globe{position:absolute;right:22px;top:18px;width:70px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.passport{overflow:hidden;background:#2B3C7A;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 #1B2757}
.stampc{background:#FFF9EC;border:3px dashed #C0392B;border-radius:14px;padding:10px 12px;transform:rotate(var(--r)) scale(2);opacity:0;animation:stampc .35s var(--d) cubic-bezier(.3,1.5,.5,1) forwards}
.stampc b{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;color:#C0392B;font-size:18px;text-transform:uppercase}
.stampc p{font-size:14.5px;margin:2px 0 0}
@keyframes stampc{to{transform:rotate(var(--r)) scale(1);opacity:1}}
/* vote formats */
.vfmt{display:inline-block;background:var(--yel);font-family:"Lilita One",Nunito,sans-serif;font-size:15px;padding:5px 12px;border-radius:10px;box-shadow:0 3px 0 var(--yel2)}
.deck{position:relative;height:270px;margin:10px 0;display:flex;justify-content:center;align-items:center}
.lab{position:absolute;top:0;max-width:44%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:900;font-size:13px;padding:6px 10px;border-radius:12px;opacity:.25;transition:opacity .2s,transform .2s}
.lab.l{left:0;background:#FFE1E3;color:#C0222C}.lab.r{right:0;background:#DDF8EA;color:#138A4C;text-align:right}
.deck.goL .lab.l,.deck.goR .lab.r{opacity:1;transform:scale(1.06)}
.scard{position:relative;z-index:2;width:240px;height:230px;margin-top:40px;background:#fff;border-radius:24px;border:3px solid var(--line);box-shadow:0 8px 0 var(--line);padding:14px;touch-action:none;cursor:grab;transition:transform .25s;user-select:none;display:flex;flex-direction:column}
.sc-top{display:flex;align-items:center;gap:8px;font-weight:900;font-size:12px;opacity:.75}.sc-top .perso{width:38px}
.scard h3{font-size:22px;margin:10px 0 auto}
.sides{display:flex;justify-content:space-between;font-family:"Lilita One",Nunito,sans-serif;font-size:18px;color:#AEB9D8}
.sbtns{display:flex;gap:10px;align-items:center}
.rb{font:inherit;font-family:"Lilita One",Nunito,sans-serif;border:0;border-radius:16px;cursor:pointer;color:#fff}
.rb.a,.rb.c{width:56px;height:56px;font-size:24px;flex:none}.rb.a{background:var(--grn);box-shadow:0 5px 0 var(--grn2)}.rb.c{background:var(--red);box-shadow:0 5px 0 #E03540}
.rb.b{flex:1;background:var(--vio);box-shadow:0 5px 0 #6D3FE0;font-size:14px;padding:10px;line-height:1.2}
.cmp{margin-top:14px}.cmp summary{cursor:pointer;font-weight:900;color:var(--blue)}
.table{display:flex;justify-content:space-around;align-items:flex-end;background:#6E4A2F;border-radius:22px;padding:14px 8px 0;margin:10px 0;box-shadow:0 6px 0 #573A24}
.min{position:relative;width:30%;background:none;border:0;cursor:pointer;padding:0;transition:transform .2s}
.min .perso{width:100%}.min .ol{position:absolute;top:-6px;right:0;background:#fff}
.min.sel{transform:translateY(-10px) scale(1.08)}.min.sel .ol{background:var(--yel)}
.center{text-align:center}
.slider{background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--line)}
.sl-lab{display:flex;justify-content:space-between;font-weight:900;font-size:12px}
.slider input{width:100%;height:40px;accent-color:var(--blue)}
.slider .card{box-shadow:none;margin:8px 0 14px}
.pulse{animation:pop .35s}
.ballots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 4px 0;align-items:end}
.bal{min-width:0;overflow-wrap:break-word;hyphens:manual;font:inherit;font-size:12px!important;padding:10px 6px 16px!important;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 8px 18px;min-height:150px;text-align:left;font-size:13px;color:var(--navy);transform:rotate(var(--r));transition:transform .3s;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.bal .ol{margin-bottom:6px}
.bal.up{transform:translateY(-18px) rotate(0) scale(1.05);border-color:var(--blue)}
.mini-urne{width:140px;margin:14px auto 0;pointer-events:none}.mini-urne .urne{position:static;width:100%;display:block;filter:drop-shadow(0 5px 0 #C9D2EA) drop-shadow(0 0 1px #AEB9D8)}
/* résultat */
.journal{background:#FFFDF6;border:2px solid #E8E1CC;border-radius:8px;padding:14px 16px;box-shadow:0 6px 0 #E8E1CC;animation:paper .7s cubic-bezier(.2,1.3,.4,1) both;margin-top:12px;text-align:center}
@keyframes paper{from{transform:rotate(-540deg) scale(.1);opacity:0}}
.mast{font-family:"Lilita One",Nunito,sans-serif;font-size:24px;border-bottom:3px double var(--navy);padding-bottom:4px}
.mast small{display:block;font-family:Nunito;font-size:11px;font-weight:800;opacity:.6}
.kw{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:12px;padding:3px 10px;margin-top:10px;border-radius:4px}
.journal h2{font-size:26px;margin:8px 0}
.hemibox{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px;margin-top:14px;text-align:center}
.hemi{width:100%;max-width:300px}
.seat{fill:#D6DDF0;transition:fill .2s}
.seat.yes{animation:seat .01s var(--d) forwards}
@keyframes seat{to{fill:#8B5CF6}}
.xpbar{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.xpbar b{font-weight:900;white-space:nowrap}.xpbar>span:last-child{font-weight:900;white-space:nowrap;opacity:.7}
.xpt{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.xpt i{display:block;height:100%;background:var(--vio);transition:width .6s}
.xpfly{position:absolute;transform:translateX(-50%);font-family:"Lilita One",Nunito,sans-serif;font-size:22px;color:var(--vio);pointer-events:none;animation:xp 1.2s ease-out forwards;z-index:20}
@keyframes xp{to{transform:translate(-50%,-70px);opacity:0}}
.skip{display:block;margin:6px auto 0;font-size:13px}
.node{position:relative}.here{position:absolute;left:-58px;top:-4px;width:48px;animation:hop 1.6s infinite}

/* ───── V3 : avatar joueur */
.avatar{text-align:center}
.portrait{position:relative;width:210px;height:230px;margin:10px auto 16px;border-radius:26px;overflow:hidden;background:#fff;border:6px solid #fff;box-shadow:0 8px 0 var(--line)}
.flag{position:absolute;inset:0;display:flex;opacity:.22}.flag i{flex:1}.flag i:nth-child(1){background:#2A5BFF}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#FF4B55}
.portrait .perso{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:170px}
.plaque{position:absolute;bottom:8px;left:10px;right:10px;background:var(--navy);color:#fff;font-size:12px;font-weight:900;border-radius:8px;padding:4px}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:18px;padding:5px;gap:5px;margin:0 0 16px}
.seg button{flex:1;font:inherit;font-family:"Lilita One",Nunito,sans-serif;font-size:19px;border:0;border-radius:13px;padding:12px;background:none;color:var(--navy);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue2)}
.pick{display:flex;align-items:center;gap:10px;margin:12px 0;text-align:left}
.pick>span{width:76px;flex:none;font-weight:900;font-size:14px}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--blue);transform:scale(1.1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:900;border:2px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:7px 11px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.avatar .btn{margin-top:14px}
.btn:disabled{background:#C9D2EA;box-shadow:0 5px 0 #AEB9D8;color:#fff;cursor:not-allowed}
.flash{position:fixed;inset:0;background:#fff;z-index:50;animation:flash .45s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.tvme{position:absolute;bottom:-8px;left:72%;width:84px;transform:translate(-50%,110%);animation:tvup .5s 1.4s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes tvup{to{transform:translate(-50%,0)}}
.tvin .reveal{top:auto;bottom:34px;left:12px;font-size:28px;max-width:58%;line-height:1}
.me{width:26px;flex:none;margin-right:2px}
/* contraste */
.qa.ok,.rb.a{color:var(--navy)}
.side.pro .lbl{background:#138A4C}
.pl.g,.up{color:#138A4C}
.lab.r{color:#0F6E3D}

/* ───── parcours */
.parcours .trend b{display:block;margin-bottom:6px}
.spark{width:100%;height:auto;display:block}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:800;align-items:center}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.pyear{margin:22px 0 8px;font-family:"Lilita One",Nunito,sans-serif;font-size:19px}
.pyear b{background:var(--navy);color:#fff;border-radius:10px;padding:3px 9px;margin-right:6px;font-weight:400}
.pc-item{background:#fff;border:2px solid var(--line);border-radius:18px;margin:10px 0;box-shadow:0 4px 0 var(--line)}
.pc-item summary,.pc-item.off{display:flex;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;align-items:flex-start}
.pc-item summary::-webkit-details-marker{display:none}
.pc-item[open]{border-color:var(--blue)}
.pc-item small{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;opacity:.6}
.pc-item b{display:block;font-size:15px;line-height:1.25}
.pc-item summary p{margin:4px 0 0;font-size:14px;color:var(--blue);font-weight:800}
.pc-item.off{opacity:.55;cursor:default}.pc-item.skip summary p{color:#6B7699}
.ol.on{background:var(--blue);color:#fff}
.mini{font-size:12px;font-weight:800;margin-top:4px;opacity:.85}
.star{color:#B07D00}
.pc-det{padding:0 14px 14px}
.pc-opt{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;margin:6px 0}
.pc-opt .ol{width:30px;height:30px;font-size:16px}
.pc-opt b{font-size:14px}.pc-opt small{text-transform:none;letter-spacing:0;font-size:12px}
.pc-opt.mine{background:#EEF2FF;outline:2px solid var(--blue)}.pc-opt.mine .ol{background:var(--blue);color:#fff}
.parcours>.btn.big{margin-top:18px}

/* ───── en-tête */
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-16px -18px 10px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:rgba(243,246,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--navy);font:inherit}
.brand .logo{width:34px;height:34px;flex:none;border-radius:10px;box-shadow:0 3px 0 var(--blue2)}
.brand span{font-family:"Lilita One",Nunito,sans-serif;font-size:22px;letter-spacing:.5px;line-height:1}
.brand span b{font-weight:400;color:var(--yel);-webkit-text-stroke:0}
.top .prog{margin-left:0}
/* ───── modes */
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--navy);background:#fff;border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--line);cursor:pointer;transition:transform .08s}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.mode.on{border-color:var(--blue);box-shadow:0 5px 0 var(--blue2)}
.mi{flex:none;width:48px;height:48px;border-radius:16px;background:var(--yel);display:grid;place-items:center;font-size:24px;box-shadow:0 4px 0 var(--yel2)}
.mode:nth-child(2) .mi{background:var(--sky1);box-shadow:0 4px 0 var(--sky2)}.mode:nth-child(3) .mi{background:var(--vio);color:#fff;box-shadow:0 4px 0 #6D3FE0}
.mt{flex:1}.mt b{display:block;font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:22px}.mt small{display:block;font-size:13px;opacity:.75;font-weight:800}
.mn{font-family:"Lilita One",Nunito,sans-serif;font-size:30px;color:var(--blue)}
.deeper{border-color:var(--sky1);box-shadow:0 5px 0 var(--sky2)}.deeper .btn{margin-top:10px}
/* ───── soirée électorale Rive */
.rvscene{aspect-ratio:auto;margin:-16px -18px 0;height:100dvh;background:#0B1736;overflow:hidden}
.rvscene>.pfb{background:var(--bg)}
.rvscene>.pfb .crowd{margin-top:170px}
.rvscene.rv-on{cursor:pointer}
.screen.elect:has(>.rvscene){padding-top:0}
#app:has(.rvscene.rv-on){padding-bottom:0}
.screen.elect:has(>.rvscene.rv-on){margin-bottom:-16px}
.rvscene:not(.rv-on)>.pfb{padding-top:30px}
.rvscene.rv-on ~ .esheet{position:absolute;left:-18px;right:-18px;bottom:0;margin:0;padding:18px 18px 24px;background:var(--bg);border-radius:28px 28px 0 0;box-shadow:0 -8px 0 rgba(19,35,75,.25);animation:sheetin .55s 4.6s cubic-bezier(.2,1.3,.4,1) both}
.rvscene.rv-on.skipped ~ .esheet{animation-delay:.2s}
.rvscene.rv-on ~ .esheet h2{margin-top:0}
@keyframes sheetin{from{transform:translateY(110%)}to{transform:none}}
.rvscene:not(.rv-on){height:auto;background:none;margin:0}
.rvscene:not(.rv-on)>.pfb{position:relative}
/* ───── carte Rive */
.node .dot{position:relative}
.rvnode{position:absolute;left:50%;top:50%;width:92px;height:92px;transform:translate(-50%,-50%);aspect-ratio:auto;pointer-events:none}
.dot:has(>.rvnode.rv-on){background:none!important;box-shadow:none!important;color:transparent;animation:none}
.here:has(.rvmark){width:72px;left:-78px;top:-8px;animation:none}
.here .rvmark{width:100%;aspect-ratio:1}
.here .rvmark>.pfb svg{width:100%;height:100%}
/* ───── jauges à deux sens */
.gb.bip{position:relative}
.gb.bip b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:#AEB9D8;border-radius:2px;z-index:1}
.gb.bip i{position:absolute;top:0;bottom:0;border-radius:9px;transition:left .6s,width .6s}
.gv small{display:block;font-family:Nunito,sans-serif;font-size:11px;font-weight:800;opacity:.6;letter-spacing:0;line-height:1.2;min-height:1.2em;white-space:nowrap}
/* ───── ailleurs : action + résultat */
.passport{gap:14px}
.stampc{padding:12px 14px 14px}
.stampc .did,.stampc .res{font-size:14.5px;margin:6px 0 0}
.pk{display:block;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:#8A6D5A}
.vd{display:table;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:999px;margin:4px 0 4px;}
.stampc .res{border-top:2px dashed #E8D9C7;padding-top:8px}
.stampc .src{margin-top:8px}
/* ───── rappel de la question au vote */
.qremind{background:var(--navy);color:#fff;border-radius:20px;padding:14px 16px;margin:8px 0 12px;box-shadow:0 5px 0 #0B1736}
.qr-l{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:var(--yel)}
.qremind b{display:block;font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:21px;line-height:1.15;margin:4px 0 6px}
.qremind p{margin:0;font-size:14px;opacity:.85;line-height:1.4}
.pl.g,.pl.r,.pl.b{background:none;border:0;padding:0;border-radius:0}
/* curseur stylé */
.slider input[type=range]{-webkit-appearance:none;appearance:none;height:44px;background:transparent;margin:4px 0}
.slider input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--vio) 50%,var(--red))}
.slider input[type=range]::-moz-range-track{height:12px;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--vio) 50%,var(--red))}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-11px;border-radius:50%;background:#fff;border:5px solid var(--navy);box-shadow:0 4px 0 rgba(19,35,75,.3);cursor:grab}
.slider input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid var(--navy);cursor:grab}
.sl-lab span{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:16px}
/* ───── navigation : accueil, rythme */
.homeopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.homeopts .btn{font-size:16px;padding:10px 12px;line-height:1.15}
.homeopts small{display:block;font-family:Nunito,sans-serif;font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#5B6B94;margin-bottom:2px}
.modechip{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;font:inherit;font-size:14px;color:var(--navy);background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 12px;cursor:pointer;min-height:44px}
.modechip u{color:var(--blue);font-weight:900;text-decoration:none}
/* ───── partage */
.shov{position:fixed;inset:0;background:rgba(11,23,54,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;animation:pop .2s both}
.shbox{background:var(--bg,#F3F6FF);border-radius:26px;padding:16px;width:100%;max-width:420px;max-height:96vh;overflow:auto;text-align:center}
.shimg{aspect-ratio:9/16;max-height:56vh;margin:0 auto 14px;border-radius:18px;overflow:hidden;background:#1C3FD1;display:flex;align-items:center;justify-content:center}
.shimg img{width:100%;height:100%;object-fit:contain;display:block}
.shbox a.btn{display:block;text-decoration:none;box-sizing:border-box}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
